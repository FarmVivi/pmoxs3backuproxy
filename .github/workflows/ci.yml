name: test backup and restore functionality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=docker depName=minio/minio versioning=docker
      MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      # renovate: datasource=docker depName=minio/mc versioning=docker
      MINIO_MC_IMAGE: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
      # renovate: datasource=deb depName=proxmox-backup-client
      PROXMOX_BACKUP_CLIENT_VERSION: 3.4.7-1
      # renovate: datasource=deb depName=libproxmox-backup-qemu0-dev
      PROXMOX_BACKUP_QEMU_DEV_VERSION: 1.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Start pinned MinIO server
        run: |
          docker run --detach --rm --name minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data --address :9000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio-ci
          exit 1

      - name: Create MinIO access
        run: |
          mkdir -p /tmp/minio-mc
          docker run --rm --network host --volume /tmp/minio-mc:/tmp/minio-mc \
            "$MINIO_MC_IMAGE" --config-dir /tmp/minio-mc alias set ci \
            http://127.0.0.1:9000 minioadmin minioadmin
          docker run --rm --network host --volume /tmp/minio-mc:/tmp/minio-mc \
            "$MINIO_MC_IMAGE" --config-dir /tmp/minio-mc mb ci/backups
          docker run --rm --network host --volume /tmp/minio-mc:/tmp/minio-mc \
            "$MINIO_MC_IMAGE" --config-dir /tmp/minio-mc admin user svcacct add \
            ci minioadmin --json > /tmp/minio.json

      - name: Install Proxmox Backup Client
        run: |
          sudo apt update -y
          curl --fail --silent --show-error \
            https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg \
            --output /tmp/proxmox-release-bookworm.gpg
          echo "13a87cec79f2d05f40f125629e4b509080a5c0286608bea273e36be9809ecaba  /tmp/proxmox-release-bookworm.gpg" | sha256sum --check
          sudo install -o root -g root -m 0644 /tmp/proxmox-release-bookworm.gpg \
            /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
          # Proxmox currently serves a mismatched certificate on this mirror's
          # HTTPS endpoint. APT still authenticates every package with the
          # pinned repository signing key.
          echo "deb http://download.proxmox.com/debian/pbs-client bookworm main" | sudo tee -a /etc/apt/sources.list.d/pbs.list
          echo "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription" | sudo tee -a /etc/apt/sources.list.d/pve.list
          sudo apt update -y
          sudo apt install -y \
            "proxmox-backup-client=$PROXMOX_BACKUP_CLIENT_VERSION" \
            "libproxmox-backup-qemu0-dev=$PROXMOX_BACKUP_QEMU_DEV_VERSION"

      - name: Build Proxy and GC
        run: |
          go mod verify
          go test -race ./cmd/... ./internal/...
          go build tizbac/pmoxs3backuproxy/cmd/pmoxs3backuproxy
          go build tizbac/pmoxs3backuproxy/cmd/garbagecollector
          go build -o fdxtest tizbac/pmoxs3backuproxy/test

      - name: Create backup and test restore
        run: |
          echo "start proxy"
          export PBS_PASSWORD=$(jq -r .secretKey < /tmp/minio.json)
          export USERNAME=$(jq -r .accessKey < /tmp/minio.json)
          export BUCKET="backups"
          export ENDPOINT="127.0.0.1:9000"
          export PBS_FINGERPRINT="55:BC:29:4B:BA:B6:A1:03:42:A9:D8:51:14:9D:BD:00:D2:2A:9C:A1:B8:4A:85:E1:AF:B2:0C:48:40:D6:CC:A4"
          export PBS_REPOSITORY="$USERNAME@pbs@127.0.0.1:$BUCKET"
          S3TEST_ENDPOINT="$ENDPOINT" S3TEST_BUCKET="$BUCKET" \
            S3TEST_ACCESSKEY="$USERNAME" S3TEST_SECRETKEY="$PBS_PASSWORD" \
            go test ./cmd/pmoxs3backuproxy -run TestIntegrationConcurrentChunkUpload -v
          S3TEST_ENDPOINT="$ENDPOINT" S3TEST_ACCESSKEY="$USERNAME" \
            S3TEST_SECRETKEY="$PBS_PASSWORD" \
            go test ./cmd/garbagecollector -run TestIntegrationGCSweep -v
          echo "start proxy"
          nohup ./pmoxs3backuproxy -endpoint $ENDPOINT -bind 127.0.0.1:8007 -debug > /tmp/nohup.out 2> /tmp/nohup.err < /dev/null &
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent https://127.0.0.1:8007/api2/json/version >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/nohup.out /tmp/nohup.err
              exit 1
            fi
            sleep 1
          done
          echo "create first backup"
          sudo -E proxmox-backup-client backup proxy.pxar:. --backup-id testbackup > /tmp/first_backup 2>&1
          cat /tmp/first_backup
          sleep 5
          echo "create second backup"
          echo new-data > changed
          sudo -E proxmox-backup-client backup proxy.pxar:. --backup-id testbackup > /tmp/second_backup 2>&1
          cat /tmp/second_backup
          echo "check if second backup was done incrementally"
          grep -q "backup was done incrementally" /tmp/second_backup
          echo "restore first backup"
          proxmox-backup-client snapshot list
          proxmox-backup-client snapshot list > /tmp/backups 2>&1 > /tmp/backups 2>&1
          VER=$(grep -m 1 testbackup /tmp/backups | awk '{print $2 }')
          echo $VER
          rm -rf /tmp/restore
          sudo -E proxmox-backup-client restore "$VER" proxy.pxar /tmp/restore/
          find /tmp/restore > /dev/null
          echo "check notes api"
          sudo -E proxmox-backup-client snapshot notes update "$VER" mynote
          sudo -E proxmox-backup-client snapshot notes show "$VER" | grep -q mynote
          echo "check files api"
          sudo -E proxmox-backup-client snapshot files "$VER" | grep -q "proxy.pxar"
          echo "check protection api"
          proxmox-backup-client snapshot protected show "$VER" | grep -q false
          proxmox-backup-client snapshot protected update "$VER" true
          proxmox-backup-client snapshot protected show "$VER" | grep -q true
          proxmox-backup-client snapshot protected update "$VER" false
          echo "run fixed index backup"
          ./fdxtest -repo "$PBS_REPOSITORY" -password "$PBS_PASSWORD"
          echo "run GC"
          ./garbagecollector -endpoint $ENDPOINT -accesskey "$USERNAME" -secretkey "$PBS_PASSWORD" -bucket backups
          echo "list backups"
          proxmox-backup-client list
          echo "forget snapshot"
          proxmox-backup-client snapshot forget "$VER"

      - name: Show service logs on failure
        if: failure()
        run: |
          docker logs minio-ci || true
          cat /tmp/nohup.out /tmp/nohup.err || true

      - name: Stop MinIO
        if: always()
        run: docker rm --force minio-ci || true
